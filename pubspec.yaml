name: edge_gen_ai
description: "On-device generative AI with Apple's Foundation Models (iOS/macOS) and Gemini Nano via ML Kit GenAI (Android)."
version: 0.4.0
homepage: https://github.com/manukj/EdgeAi
repository: https://github.com/manukj/EdgeAi

environment:
  sdk: ^3.11.1
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.1.0


flutter:
  plugin:
    platforms:
      android:
        package: com.manukj.edge_gen_ai
        pluginClass: EdgeGenAIPlugin
      ios:
        pluginClass: EdgeGenAIPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: EdgeGenAIPlugin
        sharedDarwinSource: true
